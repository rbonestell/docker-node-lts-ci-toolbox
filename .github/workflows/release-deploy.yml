name: Release Deploy

on:
  release:
    types: [published]
  # Allows the automated Node LTS update to publish the image directly,
  # since releases created with GITHUB_TOKEN do not trigger the release event.
  workflow_call:
    inputs:
      version:
        description: "Version to build and publish, without the leading 'v'"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Get version from the workflow input or the release tag
    - name: Set version
      id: version
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          # Remove 'v' prefix from tag and store version
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - uses: actions/checkout@v4
      with:
        ref: refs/tags/v${{ steps.version.outputs.VERSION }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Get git hash
    - name: Set hash
      id: vars
      run: |
        # Get short SHA
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "VERSION=${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          rbonestell/node-lts-ci-toolbox:latest
          rbonestell/node-lts-ci-toolbox:${{ steps.vars.outputs.VERSION }}
          rbonestell/node-lts-ci-toolbox:${{ steps.vars.outputs.SHORT_SHA }}
          rbonestell/node-lts-ci-toolbox:${{ steps.vars.outputs.VERSION }}-${{ steps.vars.outputs.SHORT_SHA }}
