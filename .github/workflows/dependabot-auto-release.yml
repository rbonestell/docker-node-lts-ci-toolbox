name: Dependabot Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - Dockerfile

permissions:
  contents: write

jobs:
  create-release:
    # Only for merged Dependabot base image updates
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0

    # Increment the revision number of the most recent release
    - name: Determine next version
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
        if [ -z "$LATEST" ]; then
          LATEST="v0.0.0"
        fi

        if ! [[ "$LATEST" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "Unable to parse latest release tag '$LATEST' as a semantic version" >&2
          exit 1
        fi

        VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] + 1 ))"
        echo "Previous release: $LATEST -> new release: v$VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.VERSION }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        set -euo pipefail

        BASE_IMAGE=$(grep -m1 '^FROM ' Dockerfile | sed 's/^FROM \(--platform=[^ ]* \)\?//')

        NOTES=$(printf '%s\n' \
          "Automated release for a Node LTS base image update." \
          "" \
          "- Base image: \`$BASE_IMAGE\`" \
          "- Update: $PR_TITLE (#$PR_NUMBER)")

        gh release create "v$VERSION" \
          --target "${{ github.event.pull_request.merge_commit_sha }}" \
          --title "v$VERSION" \
          --notes "$NOTES"

  deploy:
    needs: create-release
    uses: ./.github/workflows/release-deploy.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit
